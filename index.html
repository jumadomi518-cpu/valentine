<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day 💖</title>

<style>
 * {
     margin: 0;
     padding: 0;
 }

body {
    display: grid;
    height: 100vh;
    grid-template-rows: 60% 40%;
    
}
    main {
    
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
        color: white;
    }

    h1 {
        margin-top: 20px;
        font-size: 2.5rem;
        animation: fadeIn 3s ease-in-out;
    }

    .heart {
        font-size: 80px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .message {
        font-size: 1.3rem;
        margin: 15px;
        padding: 10px;
        animation: fadeIn 4s ease-in-out;
    }

    .photo-container {
        margin-top: 20px;
        opacity: 0.5;
    }

    .photo-container img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 5px solid white;
        object-fit: cover;
        box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    button {
        padding: 12px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 25px;
        background: #ff4b5c;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: white;
        color: #ff4b5c;
        transform: scale(1.1);
    }

    .flower {
        position: absolute;
        top: -50px;
        font-size: 25px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-50px) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }

    .sparkle {
        position: absolute;
        color: white;
        animation: sparkleAnim 1s forwards;
    }
    .music {
        display: flex;
        justify-content: space-evenly;
    }
    
    

    @keyframes sparkleAnim {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(2); }
    }
 iframe {
  height: 40vh;
  width: 100%;
  }
</style>
</head>

<body>
    <main>

<h1>Happy Valentine's Day 💖</h1>
<div class="heart">❤️</div>

<div class="message">
    With love from <strong>Dominic Juma</strong> 💕 <br>
    Wishing all my amazing friends a beautiful, joyful and love-filled Valentine's Day!  
    May your hearts be filled with happiness today and always 🌹✨
</div>

<div class="photo-container">
  
    <img src="IMG_20250514_172401.jpg" alt="Dominic Juma Photo">
</div>
<div class="music">
<button onclick="showSurprise()">Click For a Surprise 💌</button>

<audio id="bgMusic" src="Nandy - Nimekuzoea (Official Video)(MP3_160K).mp3" controls loop>

</audio>

</div>
</main>
<iframe src="https://www.youtube.com/embed/bY_0f2AD7FI?si"></iframe>
<script>
    function showSurprise() {
        alert("💖 You are all special to me! Stay blessed and loved always! 💖 - Dominic Juma");
        document.getElementById("bgMusic").play();
    }

    // Floating Flowers
    function createFlower() {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.innerHTML = "🌸";
        flower.style.left = Math.random() * window.innerWidth + "px";
        flower.style.animationDuration = (3 + Math.random() * 5) + "s";
        document.body.appendChild(flower);

        setTimeout(() => {
            flower.remove();
        }, 8000);
    }

    setInterval(createFlower, 500);

    // Sparkle effect on click
    document.addEventListener("click", function(e) {
        const sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");
        sparkle.innerHTML = "✨";
        sparkle.style.left = e.pageX + "px";
        sparkle.style.top = e.pageY + "px";
        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 1000);
    });
</script>

</body>
</html>
